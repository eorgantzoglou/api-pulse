[project]
name = "api-pulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.27.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.23.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
