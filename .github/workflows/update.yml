name: update

on:
  schedule:
    # 04:17 UTC daily. Off-the-hour to avoid the thundering herd of cron jobs
    # that fire at :00 and to spread load on the servers we probe.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # A PAT rather than GITHUB_TOKEN: pushes made with the default
          # token do not count as repository activity, and GitHub disables
          # cron workflows after 60 days without any.
          #
          # Use a FINE-GRAINED token scoped to this single repository with
          # `contents: write` and nothing else. Its one-year expiry cap is
          # not a reason to reach for a classic `repo`-scope token with no
          # expiration: an expired token fails the checkout step, which fails
          # the job, which fires the `!success()` step at the bottom — and
          # that step runs on GITHUB_TOKEN, needs no checkout and already
          # holds `issues: write`, so it still opens the issue. The expiry is
          # loud. A never-expiring classic `repo` token, by contrast, hands
          # this daily job write access to every repository the account owns,
          # for ever.
          #
          # Falls back to GITHUB_TOKEN when the secret is not set, so the
          # pipeline works the day the repository is created. That fallback
          # is a working default, not the intended end state: GITHUB_TOKEN
          # pushes do not count as repository activity, so on the fallback
          # alone GitHub will disable this cron after 60 days. Add the
          # fine-grained PAT as PIPELINE_TOKEN to get the activity that keeps
          # the schedule alive.
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No [dev] extra: the daily run does not need pytest, and every extra
      # transitive dependency resolved fresh from PyPI is more third-party
      # code executing in the same job that holds the push token. test.yml
      # installs the dev extra; this job must not.
      - run: pip install -e .

      - name: Run the pipeline
        # Tee the output so the failure handler can quote the reason directly
        # in the issue body. Actions logs are retained ~90 days by default, so
        # on a pipeline meant to sit unattended for months the run link is
        # exactly the thing that expires — an issue that only links out is
        # useless by the time someone reads it. pipefail keeps the CLI's exit
        # code from being masked by tee's.
        run: |
          set -o pipefail
          python -m api_pulse.cli --data-dir data 2>&1 | tee pipeline.log

      - name: Commit updated data
        run: |
          git config user.name "api-pulse-bot"
          git config user.email "api-pulse-bot@users.noreply.github.com"
          git add data

          if git diff --staged --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git commit -m "chore: daily probe $(date -u +%Y-%m-%d)"

          # Retry rather than fail. Two things make a push fail without anything
          # being wrong: GitHub's git endpoint returns a transient 500 (this cost
          # run #8 on 2026-09-15 — "remote rejected ... Internal Server Error"),
          # and a human commit can land between checkout and push. Neither is
          # worth a red run, an email and a GitHub issue, and a pipeline that
          # cries wolf is one whose alerts get ignored — which is far more
          # dangerous here than a missed day, because this thing is meant to run
          # unattended for months. A rebase between attempts covers the race; the
          # backoff covers the outage. Only a push still failing after ~2.5
          # minutes is treated as real.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; backing off and rebasing."
            sleep $(( attempt * 15 ))
            git pull --rebase || true
          done

          echo "::error::Push still failing after 5 attempts."
          exit 1

      - name: Open an issue if the run did not succeed
        # `!success()`, not `failure()`: a cancelled job — including one
        # killed by the 45-minute timeout above — is not a "failure", and a
        # timeout is the one failure mode with no other signal at all.
        if: ${{ !success() }}
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Daily probe did not complete";

            // Quote the pipeline's own output so the issue is self-contained
            // once the run log has expired. Every step here is best-effort:
            // this handler is the last line of defence, so a missing or
            // unreadable log must never stop the issue being opened. The file
            // is absent whenever the job died before the pipeline step ran
            // (a failed checkout, for instance) — that is an expected path.
            let detail = "";
            try {
              const fs = require("fs");
              const raw = fs.readFileSync("pipeline.log", "utf8").trim();
              if (raw) {
                // Tail, not head: the reason is always the last thing printed.
                let tail = raw.split("\n").slice(-20).join("\n");
                if (tail.length > 1500) {
                  tail = "...\n" + tail.slice(-1500);
                }
                // Indent into a Markdown code block rather than fencing it,
                // so a backtick in the output cannot break out of the block.
                detail =
                  "\n\n" +
                  tail.split("\n").map(function (l) { return "    " + l; }).join("\n");
              }
            } catch (err) {
              detail = "";
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Again: ${run}${detail}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ["pipeline-failure"],
                body: `The daily probe did not complete. It could be a tripped circuit breaker, a network or upstream fetch error, an expired PIPELINE_TOKEN, a rejected push, or the job hitting its timeout.\n\nRun: ${run}${detail}`,
              });
            }
