name: update

on:
  schedule:
    # 04:17 UTC daily. Off-the-hour to avoid the thundering herd of cron jobs
    # that fire at :00 and to spread load on the servers we probe.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A long-lived PAT rather than GITHUB_TOKEN: pushes made with the
          # default token do not count as repository activity, and GitHub
          # disables cron workflows after 60 days without any.
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run the pipeline
        run: python -m api_pulse.cli --data-dir data

      - name: Commit updated data
        run: |
          git config user.name "api-pulse-bot"
          git config user.email "api-pulse-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: daily probe $(date -u +%Y-%m-%d)"
          git push

      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Daily probe failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ["pipeline-failure"],
                body: `The daily probe failed. Most likely the upstream README format changed and the catalogue circuit breaker tripped.\n\nRun: ${run}`,
              });
            }
