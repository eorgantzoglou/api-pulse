name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # The daily data commit must redeploy the site too. It cannot do that via
  # `on: push`: a push made with GITHUB_TOKEN does not trigger workflows, and
  # the update job falls back to GITHUB_TOKEN when PIPELINE_TOKEN is unset.
  # workflow_run fires either way.
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The site and the data ship as one artifact, so the page fetches
      # ./data/*.json from its own origin — no CORS, no third-party host.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          ls -la _site _site/data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
