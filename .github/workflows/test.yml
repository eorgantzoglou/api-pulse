name: tests

on:
  # No branch filter on purpose. This previously read `branches: [main]` while
  # the repository's default branch is `master`, so the suite never ran at all
  # — and it would have caught the data/ packaging break on the very first push
  # after that directory appeared. A safety net that silently does not run is
  # worse than no safety net, so this triggers on every push and cannot be
  # disabled again by a branch rename.
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v
